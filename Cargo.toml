[workspace]
resolver = "2"
members = ["crates/core", "crates/cabi", "crates/wasm"]

[workspace.package]
# 与发布 tag 严格一致：tag v0.0.0 ⇔ version 0.0.0（release 流水线会校验）
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
pcx-core = { path = "crates/core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
