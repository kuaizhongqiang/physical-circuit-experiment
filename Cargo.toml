[workspace]
resolver = "2"
members = ["crates/core", "crates/cabi", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
pcx-core = { path = "crates/core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
