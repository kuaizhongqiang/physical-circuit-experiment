<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pcx 演示 · C3 两地控制</title>
<style>
  :root { --bd:#37474f; --dim:#546e7a; }
  * { box-sizing: border-box; }
  body { margin:0; background:#eceff1; font:13px system-ui,"Microsoft YaHei",sans-serif; color:#263238; }
  #app { display:flex; flex-direction:column; height:100vh; }
  header { display:flex; align-items:center; gap:12px; padding:8px 14px; background:#fff;
           border-bottom:1px solid #cfd8dc; height:44px; }
  header strong { font-size:14px; }
  #stat { color:var(--dim); }
  #diag { margin-left:auto; font-weight:600; }
  #diag.ok { color:#2e7d32; } #diag.warn { color:#ef6c00; } #diag.err { color:#c62828; }
  button { font:inherit; padding:4px 10px; border:1px solid #b0bec5; background:#fff; border-radius:4px; cursor:pointer; }
  button:hover { background:#f5f5f5; }
  #body { display:flex; flex:1; min-height:0; }
  #wrap { position:relative; padding:0; overflow:auto; }
  canvas { display:block; background:#fafafa; }
  #banner { position:absolute; left:0; right:0; top:0; padding:6px 10px; background:#c62828; color:#fff;
            font-weight:600; display:none; }
  aside { width:392px; border-left:1px solid #cfd8dc; background:#fff; display:flex; flex-direction:column; }
  #sum { padding:6px 10px; border-bottom:1px solid #eceff1; color:var(--dim); }
  #tableWrap { overflow:auto; flex:1; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th, td { padding:2px 6px; border-bottom:1px solid #f0f0f0; text-align:left; white-space:nowrap; }
  th { position:sticky; top:0; background:#fafafa; color:var(--dim); font-weight:600; }
  #tip { position:fixed; display:none; z-index:10; pointer-events:none; background:#263238; color:#eceff1;
         padding:8px 10px; border-radius:6px; font-size:12px; line-height:1.55; box-shadow:0 4px 14px rgba(0,0,0,.25); }
  #tip b { color:#fff; }
  #tip .k { color:#90a4ae; }
</style>
</head>
<body>
<div id="app">
  <header>
    <strong>C3 两地控制（双开双控）</strong>
    <span id="stat">正在加载…</span>
    <button id="clear">清空全部导线</button>
    <button id="reset">恢复初始网表</button>
    <span id="diag">—</span>
  </header>
  <div id="body">
    <div id="wrap">
      <div id="banner"></div>
      <canvas id="c" width="1280" height="860"></canvas>
    </div>
    <aside>
      <div id="sum"></div>
      <div id="tableWrap">
        <table>
          <thead><tr><th>位号</th><th>接点</th><th>V</th><th>I</th><th>状态</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </aside>
  </div>
</div>
<div id="tip"></div>
<script type="module" src="./demo.js"></script>
</body>
</html>
