<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pcx 演示 · C3 两地控制</title>
<style>
  :root { --bd:#37474f; --dim:#546e7a; }
  * { box-sizing: border-box; }
  body { margin:0; background:#eceff1; font:13px system-ui,"Microsoft YaHei",sans-serif; color:#263238; }
  #app { display:flex; flex-direction:column; height:100vh; }
  header { display:flex; align-items:center; gap:12px; padding:8px 14px; background:#fff;
           border-bottom:1px solid #cfd8dc; height:44px; flex:0 0 44px; }
  header strong { font-size:14px; }
  #stat { color:var(--dim); }
  #diag { margin-left:auto; font-weight:600; }
  #diag.ok { color:#2e7d32; } #diag.warn { color:#ef6c00; } #diag.err { color:#c62828; }
  button { font:inherit; padding:5px 12px; border:1px solid #b0bec5; background:#fff; border-radius:4px; cursor:pointer; }
  button:hover { background:#f5f5f5; }
  button.active { background:#ffe0b2; border-color:#ff6d00; }
  #body { display:flex; flex:1; min-height:0; }
  #wrap { position:relative; overflow:auto; flex:1; }
  canvas { display:block; background:#fafafa; }
  #banner { position:absolute; left:0; right:0; top:0; padding:6px 10px; background:#c62828; color:#fff;
            font-weight:600; display:none; z-index:5; }
  #toast { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); background:#263238; color:#fff;
           padding:8px 14px; border-radius:6px; font-size:12px; opacity:0; transition:opacity .18s; pointer-events:none; z-index:6; }
  #toast.show { opacity:.95; }
  aside { width:400px; flex:0 0 400px; border-left:1px solid #cfd8dc; background:#fff;
          display:flex; flex-direction:column; min-height:0; }
  #sum { padding:6px 10px; border-bottom:1px solid #eceff1; color:var(--dim); flex:0 0 auto; }
  .pane { display:flex; flex-direction:column; min-height:0; flex:1 1 50%; }
  .pane + .pane { border-top:1px solid #cfd8dc; }
  .paneTitle { padding:4px 10px; font-weight:600; color:var(--dim); background:#fafafa; flex:0 0 auto;
               display:flex; gap:8px; align-items:center; }
  .paneTitle .hint { font-weight:400; font-size:11px; }
  .scroll { overflow:auto; flex:1 1 auto; min-height:0; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th, td { padding:2px 6px; border-bottom:1px solid #f0f0f0; text-align:left; white-space:nowrap; }
  th { position:sticky; top:0; background:#fafafa; color:var(--dim); font-weight:600; z-index:1; }
  tbody tr:hover { background:#fff8e1; }
  tr.new { background:#ffe0b2; }
  #tip { position:fixed; display:none; z-index:10; pointer-events:none; background:#263238; color:#eceff1;
         padding:8px 10px; border-radius:6px; font-size:12px; line-height:1.55; box-shadow:0 4px 14px rgba(0,0,0,.25); }
  #tip b { color:#fff; }
  #tip .k { color:#90a4ae; }
</style>
</head>
<body>
<div id="app">
  <header>
    <strong>C3 两地控制（双开双控）</strong>
    <span id="stat">正在加载…</span>
    <button id="clear">清空全部导线</button>
    <button id="reset">恢复初始网表</button>
    <span id="diag">—</span>
  </header>
  <div id="body">
    <div id="wrap">
      <div id="banner"></div>
      <canvas id="c" width="1280" height="860"></canvas>
      <div id="toast"></div>
    </div>
    <aside>
      <div id="sum"></div>
      <div class="pane">
        <div class="paneTitle">接点 <span class="hint">悬停看全部数值</span></div>
        <div class="scroll">
          <table>
            <thead><tr><th>位号</th><th>接点</th><th>V</th><th>I</th><th>状态</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
      <div class="pane">
        <div class="paneTitle">导线 <span class="hint">新加的在最上面，点行可高亮</span></div>
        <div class="scroll">
          <table>
            <thead><tr><th>#</th><th>从</th><th>到</th><th>电流</th></tr></thead>
            <tbody id="wireBody"></tbody>
          </table>
        </div>
      </div>
    </aside>
  </div>
</div>
<div id="tip"></div>
<script type="module" src="./demo.js"></script>
</body>
</html>
